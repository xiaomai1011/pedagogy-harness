<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>面向编程初学者的可插拔教学法练习助手的设计与实现</title>
  <style>
    /* ---------- 深色主题变量 ---------- */
    :root {
      --bg: #1e1e1e; --bg-soft: #252526; --bg-hard: #2f2f30;
      --bg-panel: #232324;
      --line: #3c3c3c; --line-soft: #333335;
      --fg: #d9d9d9; --fg-dim: #a6a6a6; --fg-weak: #838383;
      --accent: #0e639c; --accent-hover: #1177bb;
      --ok: #4ec9b0; --warn: #d7ba7d; --bad: #f48771;
      --judge: #4a9eff; --teach: #b07cd6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; background: var(--bg); color: var(--fg);
      font-family: -apple-system, "Microsoft YaHei", "Segoe UI", sans-serif;
      font-size: 15px; line-height: 1.75;
      overflow: auto;   /* 窗口很矮时允许整页滚动，避免操作条被挤出可视区 */
    }
    /* ---------- 布局：标题栏 / 横幅 / (活动栏·题目栏·工作区) / 状态栏 ---------- */
    .app {
      height: 100vh; min-height: 480px; display: grid;
      /* 左栏默认 560px：题干/输入说明较长时才不用反复折行；可用中间竖条拖动，宽度记在 localStorage */
      grid-template-columns: 44px var(--side-w, 560px) minmax(0, 1fr);
      grid-template-rows: 46px auto minmax(0, 1fr) 26px;
      grid-template-areas:
        "titlebar titlebar titlebar"
        "banner   banner   banner"
        "activity sidebar  work"
        "status   status   status";
    }
    .titlebar { grid-area: titlebar; display: flex; align-items: center; gap: 14px;
      padding: 0 14px; background: var(--bg-hard); border-bottom: 1px solid var(--line); font-size: 14px; }
    .titlebar h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .3px; }
    .spacer { margin-left: auto; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { font-size: 12px; padding: 2px 9px; border: 1px solid var(--line);
      border-radius: 10px; color: var(--fg-dim); background: var(--bg-soft); }

    /* ---------- 横幅：桩判题警示 / 前后测说明 ---------- */
    .banner { grid-area: banner; display: none; padding: 10px 16px; font-size: 14px;
      line-height: 1.7; border-bottom: 1px solid var(--line); }
    .banner.show { display: block; }
    .banner.stub { background: #3a2f18; color: #f2dca8; border-bottom-color: #5c4a1e; }
    .banner.phase { background: #1d2c3a; color: #a8cbe8; border-bottom-color: #2c4359; }
    .banner b { font-weight: 700; }

    .activity { grid-area: activity; background: var(--bg-hard);
      border-right: 1px solid var(--line); display: flex; flex-direction: column;
      align-items: center; padding-top: 12px; gap: 14px; }
    .activity span { font-size: 18px; color: var(--fg-dim); }

    /* ---------- 题目栏 ---------- */
    .sidebar { grid-area: sidebar; background: var(--bg-soft); border-right: 1px solid var(--line);
      overflow: auto; padding: 16px 18px 28px; }
    .sidebar h2.q-title { font-size: 19px; margin: 12px 0 4px; line-height: 1.5; }
    .sidebar .q-meta { color: var(--fg-dim); font-size: 13px; margin-bottom: 12px; }
    .sidebar .q-stmt { line-height: 1.9; font-size: 16px; white-space: pre-wrap; margin: 8px 0 16px; }
    /* 题目列表可收起：默认限高滚动，收起后整栏高度都留给题目说明 */
    .sb-head { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; }
    .sb-head h3.sec { margin: 0; }
    .sb-head .btn { padding: 1px 10px; font-size: 12px; line-height: 1.7; }
    #qlist { max-height: min(240px, 30vh); overflow: auto; padding-right: 4px; }
    .sidebar.collapsed #qlist { display: none; }
    /* 收起后仍能看见当前题目，按钮变成「切换题目」 */
    #q-current { display: none; font-size: 12px; max-width: 46%; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    .sidebar.collapsed #q-current { display: inline; }
    /* 窄屏（笔记本）按可用宽度收窄，别把工作区挤没 */
    @media (max-width: 1500px) { .app { grid-template-columns: 44px var(--side-w, 500px) minmax(0, 1fr); } }
    @media (max-width: 1180px) { .app { grid-template-columns: 44px var(--side-w, 400px) minmax(0, 1fr); } }

    /* 左右分栏拖动条：贴在题目栏右边界上 */
    .work { position: relative; }
    .vsplit { position: absolute; left: -3px; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 6; }
    .vsplit:hover, .vsplit.dragging { background: var(--accent); opacity: .55; }
    .io-req { background: var(--bg-panel); border: 1px solid var(--line-soft);
      border-radius: 6px; padding: 12px 14px; margin-bottom: 16px; line-height: 1.9; font-size: 14px; }
    .io-req .k { color: var(--judge); font-weight: 600; }
    .ex-card { background: var(--bg-panel); border: 1px solid var(--line-soft);
      border-radius: 6px; padding: 12px 14px; margin-bottom: 10px; font-size: 14px; line-height: 1.9; }
    .ex-card .row { display: flex; gap: 10px; }
    .ex-card .row .k { color: var(--fg-dim); min-width: 56px; }
    .ex-card code, .io-req code { font-family: Consolas, Menlo, monospace; color: #ce9178; font-size: 14px; white-space: pre-wrap; }
    .muted { color: var(--fg-dim); }
    .weak { color: var(--fg-weak); }

    /* ---------- 工作区：编辑器 ─ 拖动条 ─ 操作条 ─ 结果双区 ---------- */
    .work { grid-area: work; display: flex; flex-direction: column; min-height: 0; }
    .edit-pane { flex: 0 0 var(--edit-h, 65%); min-height: 88px; position: relative;
      border-bottom: 1px solid var(--line); }
    /* 编辑器左上角的用途标识：空白时也能一眼看出这里是写代码的地方 */
    .edit-tag { position: absolute; right: 10px; top: 6px; z-index: 4; pointer-events: none;
      font-size: 12px; letter-spacing: .3px; color: var(--fg-weak);
      background: rgba(30, 30, 30, .72); border: 1px solid var(--line-soft);
      border-radius: 10px; padding: 1px 9px; }
    #editor { position: absolute; inset: 0; }
    #code-ta { position: absolute; inset: 0; width: 100%; height: 100%; resize: none;
      background: #1e1e1e; color: #d4d4d4; border: 0; padding: 14px;
      font-family: Consolas, Menlo, monospace; font-size: 16px; line-height: 1.7; }
    /* 反馈变长时，拖这里就能给下方腾地方 */
    .splitter { flex: 0 0 7px; cursor: row-resize; background: var(--bg-hard);
      border-bottom: 1px solid var(--line); }
    .splitter:hover, .splitter.dragging { background: var(--accent); }
    .splitter::after { content: ""; display: block; width: 46px; height: 3px; margin: 2px auto 0;
      border-radius: 2px; background: var(--line); }

    .actionbar { flex: 0 0 50px; display: flex; align-items: center; gap: 12px; padding: 0 14px;
      background: var(--bg-hard); border-bottom: 1px solid var(--line); font-size: 14px; }
    .actionbar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
    /* 提示等级：**只读状态展示**（不是可点击升级的按钮） */
    .lvl-strip { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px;
      color: var(--fg-dim); }
    .lvl { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 10px;
      border: 1px solid var(--line); color: var(--fg-weak); background: var(--bg); font-size: 13px; }
    .lvl.on { border-color: var(--teach); color: #e5d4f5; background: rgba(176,124,214,.16); }
    .lvl.cur { border-color: var(--accent); color: #fff; background: var(--accent); }
    .help { cursor: help; color: var(--fg-dim); font-size: 13px; border: 1px solid var(--line);
      border-radius: 50%; width: 18px; height: 18px; display: inline-flex; align-items: center;
      justify-content: center; }

    /* 结果双区：左＝程序运行结果，右＝AI 学习提示（**各说各的，不互相复述**） */
    .results { flex: 1 1 auto; min-height: 88px; display: grid; grid-template-columns: 1fr 1fr; }
    .result-col { display: flex; flex-direction: column; min-height: 0; background: var(--bg-panel); }
    .result-col + .result-col { border-left: 1px solid var(--line); }
    .result-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px;
      border-bottom: 1px solid var(--line-soft); font-size: 14px; font-weight: 600; }
    .result-head .dot { width: 8px; height: 8px; border-radius: 50%; }
    .result-head.judge .dot { background: var(--judge); }
    .result-head.teach .dot { background: var(--teach); }
    .result-head .sub { font-weight: 400; color: var(--fg-dim); font-size: 13px; }
    .result-body { padding: 14px 16px; overflow: auto; flex: 1; line-height: 1.8; font-size: 16px; }
    .result-body.mono { font-family: Consolas, Menlo, monospace; font-size: 14px; white-space: pre-wrap; }
    .case { border-left: 2px solid var(--line); padding-left: 12px; margin: 12px 0; line-height: 1.8; }
    .case .muted { white-space: pre-wrap; }
    .case.hidden { border-left-color: var(--warn); }
    .hint-text { white-space: pre-wrap; line-height: 1.9; }
    .kp { margin-top: 14px; color: var(--fg-dim); font-size: 14px; }
    details.memo { margin-top: 10px; color: var(--fg-weak); font-size: 13px; }
    details.memo summary { cursor: pointer; }

    .statusbar { grid-area: status; background: var(--bg-hard); border-top: 1px solid var(--line);
      display: flex; align-items: center; gap: 16px; padding: 0 14px; font-size: 13px;
      color: var(--fg-dim); white-space: nowrap; overflow: hidden; }

    /* ---------- 通用控件 ---------- */
    button.btn { padding: 7px 16px; border-radius: 4px; border: 1px solid var(--line);
      background: var(--bg-hard); color: var(--fg); cursor: pointer; font-size: 14px; }
    button.btn:disabled { opacity: .45; cursor: not-allowed; }
    button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button.btn.busy { opacity: .8; cursor: progress; }
    input.pid { background: var(--bg); border: 1px solid var(--line); color: var(--fg);
      padding: 4px 8px; border-radius: 4px; width: 96px; font-size: 14px; }
    .q-item { padding: 8px 10px; border-radius: 4px; cursor: pointer; line-height: 1.7; font-size: 14px; }
    .q-item:hover { background: var(--bg-hard); }
    .q-item.sel { background: var(--accent); color: #fff; }
    h3.sec { font-size: 13px; text-transform: uppercase; color: var(--fg-dim);
      margin: 20px 0 8px; letter-spacing: .8px; border-top: 1px solid var(--line-soft); padding-top: 14px; }
    h3.sec:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
    .flag { color: var(--warn); border: 1px solid var(--warn); border-radius: 4px;
      padding: 6px 10px; display: block; margin: 8px 0; font-size: 13px; line-height: 1.7; }
    .hint-badge { display: inline-block; padding: 2px 10px; border-radius: 10px;
      background: var(--teach); color: #fff; font-size: 13px; margin-right: 8px; }
    .notice { font-size: 13px; padding: 3px 10px; border-radius: 10px; border: 1px solid var(--line); }
    .notice.idle { color: var(--fg-weak); }
    .notice.busy { color: var(--warn); border-color: var(--warn); }
    .notice.ok { color: var(--ok); border-color: var(--ok); }
    .notice.bad { color: var(--bad); border-color: var(--bad); }
  </style>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <h1>可插拔教学法练习助手</h1>
    <label class="muted">被试编号 <input class="pid" id="pid" value="S01" /></label>
    <label class="muted">实验访问码 <input class="pid" id="access" placeholder="负责人发放（粘贴整串）" /><span class="muted" id="access-len" style="font-size:12px;margin-left:6px"></span></label>
    <span class="notice idle" id="op-state">服务就绪</span>
    <span class="notice idle" id="id-state" title="这里只反映身份校验状态：未验证＝尚未用访问码提交过任何请求">身份：未验证</span>
    <span class="notice idle" id="phase-state" title="前测 → 练习 → 后测，顺序由服务端锁定；时间地点自行安排">阶段：—</span>
    <span class="muted" id="privacy-note" style="font-size:12px" title="本页面会记录代码提交、提示使用与判题结果，用于本次教学研究与改进；不收集姓名。匿名会话编号保存在本机浏览器中。">· 本页记录代码与提示使用（不含姓名）</span>
    <span class="spacer"></span>
    <!-- 组件徽标属**开发调试信息**：学生模式下默认收起，见「调试」开关 -->
    <div class="badges" id="badges"></div>
    <button class="btn" id="btn-debug" title="显示/隐藏开发调试信息">调试</button>
  </header>

  <!-- 横幅：桩判题警示 / 前后测阶段说明 -->
  <div class="banner" id="banner"></div>

  <nav class="activity"><span title="题目">▤</span><span title="反馈">◍</span></nav>

  <!-- 题目栏 -->
  <aside class="sidebar">
    <div class="sb-head">
      <h3 class="sec">题目列表</h3>
      <span class="muted" id="q-current" title="收起状态下显示当前题目"></span>
      <span class="muted" id="qcount" style="font-size:12px"></span>
      <span class="spacer"></span>
      <button class="btn" id="btn-toggle-list" aria-expanded="true"
        title="收起后整栏高度都留给题目说明，点「展开列表」可还原">收起列表</button>
    </div>
    <div id="qlist" class="muted">加载中…</div>
    <div id="qdetail"></div>
  </aside>

  <!-- 工作区 -->
  <main class="work" id="work">
    <div class="vsplit" id="vsplit" title="左右拖动调整题目栏宽度（双击恢复默认）"></div>
    <div class="edit-pane"><div class="edit-tag">Python 代码</div><div id="editor"></div></div>
    <div class="splitter" id="splitter" title="向上拖动可放大下方反馈区；向下拖动可放大代码区"></div>

    <div class="actionbar">
      <button class="btn primary" id="btn-submit" disabled>提交代码</button>
      <button class="btn" id="btn-hint" disabled>请求提示</button>
      <button class="btn" id="btn-rehint" disabled>重看提示</button>
      <button class="btn" id="btn-finish" style="display:none"
        title="结束当前阶段后进入下一阶段；未通过、未完成的题目会如实保留，不能返回修改">结束本阶段</button>
      <div class="sep"></div>
      <span class="notice idle" id="op-msg">选择题目后可提交</span>
      <!-- 等级信息只在①这里与②AI 区标题两处出现；机制解释收进 ⓘ 帮助 -->
      <span class="lvl-strip">
        <span class="muted">提示等级</span>
        <span class="lvl" data-lvl="1">L1</span>
        <span class="lvl" data-lvl="2">L2</span>
        <span class="lvl" data-lvl="3">L3</span>
        <span class="lvl" data-lvl="4">L4</span>
        <span class="help" title="等级只作状态展示，不能点击升级。&#10;每连续失败 2 次解锁一级；主动请求「进一步提示」每次最多升一级（上限 L4）；两者同时满足只升一级。&#10;「重看提示」只回放上一次已生成的提示，不会升级，也不会重新调用模型。">ⓘ</span>
      </span>
    </div>

    <div class="results">
      <div class="result-col">
        <div class="result-head judge"><span class="dot"></span><span id="h-judge-title">程序运行结果</span>
          <span class="sub" id="h-judge">尚未提交</span></div>
        <div class="result-body mono" id="tab-judge">提交后，这里显示判题器返回的程序运行结果。</div>
      </div>
      <div class="result-col">
        <div class="result-head teach"><span class="dot"></span>AI 学习提示
          <span class="sub" id="h-hint">尚未请求</span></div>
        <div class="result-body" id="tab-hint">这里只显示教学提示：先给本次提示，再给相关知识点与历史提醒。</div>
      </div>
    </div>
  </main>

  <footer class="statusbar">
    <span id="st-pid">S01</span>
    <span id="st-qid">—</span>
    <span id="st-phase">—</span>
    <span id="st-seq">提交序号 —</span>
    <span id="st-ms">耗时 —</span>
  </footer>
</div>

<!-- Monaco（**本地** AMD 构建，断网可用；不用 CDN） -->
<script src="/vendor/monaco/vs/loader.js"></script>
<script>
  // ---------- 状态 ----------
  // 不预填示例代码：进入题目时编辑区为空，由学生自己写答案
  const state = {
    qid: null, question: null, editorReady: false, usingMonaco: false,
    debug: false,           // 学生模式默认**收起**开发调试信息
  debugAllowed: true,     // 由 /api/status 决定；实验模式服务端会设为 false
    judgeStub: false,       // 服务端探测：判题器是否仍为桩
    isolationReady: true,   // 服务端探测：安全执行适配器是否已登记（未登记 ⇒ 提交会被拒绝）
    isolationNote: "",      // 未就绪时服务端给出的说明
    lastHintRequestId: "",  // 上一次成功提示的请求号（「重看提示」复用它）
    hintRequested: false,   // 本题是否已经请求过提示（决定按钮文案）
    phase: "",              // 当前阶段（服务端 /api/me 给出）
    busy: false
  };
  const PHASE_LABEL = { pretest: "前测", practice: "练习", posttest: "后测", done: "已完成" };
  const PHASE_NOTE = {
    pretest: "当前为前测阶段：本阶段不提供 AI 学习提示（你的提交仍会正常记录）。",
    posttest: "当前为后测阶段：本阶段不提供 AI 学习提示（你的提交仍会正常记录）。"
  };
  const STUB_NOTE = "当前为模拟判题：判题器尚未接入真实代码执行，结果不代表真实运行。";
  const STUB_HINT_NOTE = "当前提示基于模拟判题，不用于判断代码正确性。";

  const GROUP = "exp";   // 学生界面不显示分组：正式实验统一 exp（契约 §5）

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s === undefined || s === null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // 题面是纯文本+少量 **加粗** 标记：先转义再只把 **…** 变成 <b>，不引入其它 HTML
  const richText = (s) => esc(s).replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");

  // ---------- 编辑器 ----------
  function getCode() { return state.usingMonaco ? monacoEditor.getValue() : $("code-ta").value; }
  function setReady() { state.editorReady = true; refreshButtons(); }
  function initFallbackEditor(reason) {
    if (state.usingMonaco) return;
    if (!state.editorReady) console.warn("Monaco 未就绪，退化为纯文本框：", reason);
    const ta = document.createElement("textarea");
    ta.id = "code-ta"; ta.value = ""; ta.placeholder = "在这里写你的 Python 3 代码";
    $("editor").replaceWith(ta);
    state.usingMonaco = false;
    setReady();
  }
  let monacoEditor = null;
  function initEditor() {
    if (!window.require) return initFallbackEditor("loader.js 未加载");
    self.MonacoEnvironment = { getWorkerUrl: () => "/vendor/monaco/vs/base/worker/workerMain.js" };
    require.config({ paths: { vs: "/vendor/monaco/vs" } });
    setTimeout(() => initFallbackEditor("加载超时"), 8000);
    try {
      require(["vs/editor/editor.main"], function () {
        if (state.editorReady) return;
        monacoEditor = monaco.editor.create($("editor"), {
          value: "", language: "python", theme: "vs-dark",
          automaticLayout: true, minimap: { enabled: false }, fontSize: 15,
          lineHeight: 23,
          // 只做语法着色：关掉补全/触发器，避免把 API 用法喂给学生（与"不给答案"主张一致）
          quickSuggestions: false, suggestOnTriggerCharacters: false,
          wordBasedSuggestions: "off", parameterHints: { enabled: false }
        });
        state.usingMonaco = true;
        setReady();
      }, function () { initFallbackEditor("editor.main 加载失败"); });
    } catch (e) { initFallbackEditor(e); }
  }

  // ---------- 上下拖动分隔条（反馈变长时给下方腾地方）----------
  function initSplitter() {
    const work = $("work"), sp = $("splitter");
    let dragging = false;
    sp.addEventListener("pointerdown", (e) => {
      dragging = true; sp.classList.add("dragging"); sp.setPointerCapture(e.pointerId);
      document.body.style.userSelect = "none";
    });
    sp.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const rect = work.getBoundingClientRect();
      const pct = ((e.clientY - rect.top) / rect.height) * 100;
      // 上下都有最小高度：编辑器 ≥88px、反馈区（含操作条）≥110px，避免拖到看不见
      const minPct = (88 / rect.height) * 100;
      const maxPct = 100 - (110 / rect.height) * 100;
      const lo = Math.min(75, Math.max(20, minPct));
      const hi = Math.max(lo, Math.min(75, maxPct));
      work.style.setProperty("--edit-h", Math.min(hi, Math.max(lo, pct)) + "%");
    });
    const stop = (e) => {
      if (!dragging) return;
      dragging = false; sp.classList.remove("dragging");
      document.body.style.userSelect = "";
      if (e && e.pointerId !== undefined) { try { sp.releasePointerCapture(e.pointerId); } catch (_) {} }
    };
    sp.addEventListener("pointerup", stop);
    sp.addEventListener("pointercancel", stop);
  }

  // 左右分栏：拖动题目栏右边界改宽度，双击恢复 560px；宽度记在 localStorage
  function setSideWidth(px, remember) {
    const w = Math.max(320, Math.min(860, Math.round(px)));
    document.documentElement.style.setProperty("--side-w", w + "px");
    if (remember) { try { localStorage.setItem("ph_side_w", String(w)); } catch (e) { /* 忽略 */ } }
  }
  function initSideDrag() {
    const vs = $("vsplit");
    if (!vs) return;
    try {
      const saved = parseInt(localStorage.getItem("ph_side_w") || "", 10);
      if (saved) setSideWidth(saved, false);
    } catch (e) { /* 忽略 */ }
    let dragging = false;
    vs.addEventListener("pointerdown", (e) => {
      dragging = true; vs.classList.add("dragging");
      try { vs.setPointerCapture(e.pointerId); } catch (_) {}
      document.body.style.userSelect = "none"; e.preventDefault();
    });
    vs.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      setSideWidth(e.clientX - 44, false);      // 44px 是左侧活动栏
    });
    const stop = (e) => {
      if (!dragging) return;
      dragging = false; vs.classList.remove("dragging");
      document.body.style.userSelect = "";
      try {
        const w = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--side-w"));
        if (w) setSideWidth(w, true);
      } catch (_) {}
      if (e && e.pointerId !== undefined) { try { vs.releasePointerCapture(e.pointerId); } catch (_) {} }
    };
    vs.addEventListener("pointerup", stop);
    vs.addEventListener("pointercancel", stop);
    vs.addEventListener("dblclick", () => setSideWidth(560, true));
  }

  // ---------- 操作状态 / 按钮 ----------
  function notify(kind, text, target) {
    const el = $(target || "op-state");
    el.className = "notice " + kind; el.textContent = text;
  }
  // 身份状态单独一颗徽标：不要用「服务就绪」推断"已通过访问校验"
  function setIdentity(kind, text) {
    const el = $("id-state");
    if (el) { el.className = "notice " + kind; el.textContent = text; }
  }
  function phaseAllowsTeaching() { return !!state.question && state.question.phase === "practice"; }
  function refreshButtons() {
    const ready = state.editorReady && !state.busy && state.phase !== "done";
    $("btn-submit").disabled = !ready;
    $("btn-hint").disabled = !ready || !phaseAllowsTeaching();  // 前后测：禁用而非隐藏
    $("btn-rehint").disabled = !ready || !state.lastHintRequestId || !phaseAllowsTeaching();
    $("btn-submit").classList.toggle("busy", state.busy);
    $("btn-hint").classList.toggle("busy", state.busy);
  }
  function setBusy(on, which) {
    state.busy = on; refreshButtons();
    if (on) {
      notify("busy", which === "judge" ? "判题中…" : "提示生成中…", "op-msg");
      $("btn-submit").textContent = (which === "judge") ? "提交中…" : "提交代码";
      $("btn-hint").textContent = (which === "hint") ? "生成中…" : hintButtonLabel();
    } else {
      $("btn-submit").textContent = "提交代码";
      $("btn-hint").textContent = hintButtonLabel();
    }
  }
  function hintButtonLabel() {
    return state.hintRequested ? "请求进一步提示" : "请求提示";
  }

  // ---------- 横幅 ----------
  function refreshBanner() {
    const el = $("banner"), lines = [];
    let kind = "";
    if (state.judgeStub) { lines.push(`<b>⚠ 模拟判题</b>　${esc(STUB_NOTE)}`); kind = "stub"; }
    if (!state.isolationReady) {
      // 安全门：未接入/未就绪时服务端会拒绝判题；提前讲清"不会在你的电脑上跑代码"
      lines.push('<b>⚠ 判题环境未就绪</b>　'
        + esc(state.isolationNote
          || '本次部署尚未接入安全执行环境，提交会被拒绝并记录为"未执行"，不会运行任何学生代码。'));
      kind = kind || "stub";
    }
    if (state.question && PHASE_NOTE[state.question.phase]) {
      lines.push(`<b>ⓘ ${esc(PHASE_LABEL[state.question.phase])}阶段</b>　${esc(PHASE_NOTE[state.question.phase])}`);
      kind = kind || "phase";
    }
    el.innerHTML = lines.join("<br>");
    el.className = "banner" + (lines.length ? " show " + kind : "");
    $("h-judge-title").textContent = state.judgeStub ? "模拟运行结果" : "程序运行结果";
  }

  // ---------- 提示等级（只读）----------
  function renderLevels(hintLevel, unlocked) {
    document.querySelectorAll(".lvl-strip .lvl").forEach((el) => {
      const n = Number(el.dataset.lvl);
      el.classList.toggle("on", n <= unlocked);
      el.classList.toggle("cur", n === hintLevel && hintLevel > 0);
      el.title = n <= unlocked ? `L${n} 已解锁` : `L${n} 未解锁（需连续失败 ${n * 2} 次）`;
    });
  }

  async function loadStatus() {
    try {
      const s = await (await fetch("/api/status")).json();
      state.judgeStub = s.judge === "stub";
      state.isolationReady = s.isolation === "ready";
      state.isolationNote = s.isolation_note || "";
      // 实验模式服务端不下发组件轨迹，界面也不显示入口（权限在服务端，不只是藏按钮）
      state.debugAllowed = s.debug !== false;
    } catch (e) {
      state.judgeStub = false;
      state.isolationReady = true;   // 探测失败不误报：真正的拒绝文案由提交接口返回
      state.isolationNote = "";
      state.debugAllowed = false;
    }
    if (!state.debugAllowed) { state.debug = false; }
    $("btn-debug").style.display = state.debugAllowed ? "" : "none";
    applyDebug();
    refreshBanner();
  }

  async function loadComponents() {
    try {
      const d = await (await fetch("/api/components")).json();
      $("badges").innerHTML = (d.registered || [])
        .map((n) => `<span class="badge">${esc(n)}</span>`).join("");
    } catch (e) { $("badges").innerHTML = '<span class="badge">组件未知</span>'; }
  }
  function applyDebug() {
    $("badges").style.display = state.debug ? "" : "none";
    $("btn-debug").textContent = state.debug ? "调试 ✓" : "调试";
  }

  // ---------- 题目 ----------
  async function loadQuestionList() {
    const resp = await fetch("/api/questions", { headers: accessHeaders() });
    if (resp.status === 403) {
      const d = await resp.json().catch(() => ({}));
      state.question = null;
      const cur0 = $("q-current"); if (cur0) { cur0.textContent = ""; cur0.title = ""; }
      $("qcount").textContent = "";
      $("qlist").innerHTML = `<span class="muted">${esc(accessErrorText(d))}</span>`;
      $("qdetail").innerHTML = '<div class="muted">填写负责人发放的实验访问码后，这里只显示该阶段允许做的题目；改完访问码会自动刷新。</div>';
      return;
    }
    const list = await resp.json();
    $("qcount").textContent = list.length ? list.length + " 题" : "";
    if (!list.length) {
      $("qlist").innerHTML =
        '<span class="muted">题库未就绪（岗位 4-A 交付后自动出现在这里）</span>' +
        '<div style="margin-top:8px;display:flex;gap:6px">' +
        '<input class="pid" id="qid-manual" value="P001" />' +
        '<button class="btn" id="qid-load">加载</button></div>';
      $("qid-load").onclick = () => selectQuestion(($("qid-manual").value || "").trim() || "P001");
      return;
    }
    $("qlist").innerHTML = list.map((q) =>
      `<div class="q-item" data-id="${esc(q.id)}">${esc(q.id)} · ${esc(q.title)}` +
      `<span class="muted" style="font-size:12px"> ${esc(PHASE_LABEL[q.phase] || "未标注")}</span></div>`).join("");
    document.querySelectorAll(".q-item").forEach((el) => { el.onclick = () => selectQuestion(el.dataset.id); });
    selectQuestion(list[0].id);
  }

  // 题目列表收起/展开：状态记在 localStorage，刷新后保持
  function applyListCollapsed(collapsed) {
    document.querySelector(".sidebar").classList.toggle("collapsed", collapsed);
    const btn = $("btn-toggle-list");
    btn.textContent = collapsed ? "切换题目" : "收起列表";
    btn.setAttribute("aria-expanded", String(!collapsed));
    const cur = $("q-current");
    if (cur) {
      const q = state.question;
      cur.textContent = q ? `当前：${q.id} ${q.title}` : "";
      cur.title = q ? `${q.id} ${q.title}` : "";
    }
    try { localStorage.setItem("ph_qlist_collapsed", collapsed ? "1" : "0"); } catch (e) { /* 隐私模式下忽略 */ }
  }
  $("btn-toggle-list").onclick = () => {
    const collapsed = document.querySelector(".sidebar").classList.contains("collapsed");
    applyListCollapsed(!collapsed);
  };
  try { applyListCollapsed(localStorage.getItem("ph_qlist_collapsed") === "1"); }
  catch (e) { applyListCollapsed(false); }

  // 被试编号也放进 sessionStorage：刷新后不会退回默认 S01，避免与访问码里的身份对不上。
  try {
    const savedPid = sessionStorage.getItem("ph_pid");
    if (savedPid) $("pid").value = savedPid;
  } catch (e) { /* 隐私模式下忽略 */ }
  $("pid").addEventListener("change", () => {
    try { sessionStorage.setItem("ph_pid", $("pid").value || ""); } catch (e) { /* 忽略 */ }
  });
  // 手机复制长串时常带换行/空格：粘贴后自动去掉所有空白，并显示长度便于核对是否粘贴完整。
  $("access").addEventListener("input", () => {
    const el = $("access");
    const cleaned = (el.value || "").replace(/\s+/g, "");
    if (cleaned !== el.value) el.value = cleaned;
    $("access-len").textContent = cleaned ? "已输入 " + cleaned.length + " 字符" : "";
    clearTimeout(_idTimer);
    _idTimer = setTimeout(syncIdentity, 400);
  });

  // 访问码也留在 sessionStorage：刷新后不用重填，题目列表才能按阶段/发布状态过滤。
  try {
    const savedCode = sessionStorage.getItem("ph_access");
    if (savedCode) $("access").value = savedCode;
  } catch (e) { /* 隐私模式下忽略 */ }
  $("access").addEventListener("change", () => {
    try { sessionStorage.setItem("ph_access", ($("access").value || "").trim()); } catch (e) { /* 忽略 */ }
    syncIdentity();
    loadQuestionList();   // 改完访问码立刻按新身份/阶段刷新题目列表
  });

  // 请求号存进 sessionStorage：页面刷新后仍能点「重看提示」，服务端会回放上次结果（不升级、不调模型）。
  function hintStoreKey() {
    const pid = ($("pid").value || "").trim();
    return "ph_hint_rid:" + pid + ":" + (state.qid || "");
  }
  function saveHintRid(rid) {
    try { if (rid) sessionStorage.setItem(hintStoreKey(), rid); } catch (e) { /* 隐私模式下忽略 */ }
  }
  function loadHintRid() {
    try { return sessionStorage.getItem(hintStoreKey()) || ""; } catch (e) { return ""; }
  }

  async function selectQuestion(qid) {
    state.qid = qid;
    // 切题：先清空，再从会话存储里恢复该题上一次成功提示的请求号（刷新页面也能「重看」）
    state.lastHintRequestId = loadHintRid();
    state.hintRequested = false;
    $("btn-hint").textContent = hintButtonLabel();
    refreshButtons();
    document.querySelectorAll(".q-item").forEach((el) => el.classList.toggle("sel", el.dataset.id === qid));
    const qresp = await fetch(`/api/questions/${encodeURIComponent(qid)}`, { headers: accessHeaders() });
    if (!qresp.ok) {
      const d = await qresp.json().catch(() => ({}));
      state.question = null;
      $("qdetail").innerHTML = `<div class="muted">${esc(accessErrorText(d))}</div>`;
      refreshBanner(); refreshButtons();
      return;
    }
    state.question = await qresp.json();
    const q = state.question;
    // 评测用例不下发也不提前展示：页面上只给题面里的示例，用例结果在提交后由判题反馈体现
    const exList = q.examples || [];
    $("qdetail").innerHTML = `
      <h2 class="q-title">${esc(q.id)} · ${esc(q.title)}</h2>
      <div class="q-meta">难度 ${esc(q.difficulty)}　·　阶段 ${esc(PHASE_LABEL[q.phase] || q.phase || "未标注")}</div>
      <h3 class="sec">题目说明</h3>
      <div class="q-stmt">${richText(q.statement)}</div>
      <h3 class="sec">输入输出要求</h3>
      <div class="io-req">
        <div><span class="k">输入</span>　读入的内容见下方示例；<b>同一行</b>内的多个数据以空格分隔。</div>
        <div><span class="k">输出</span>　按题目说明输出结果；<b>不要</b>输出多余的文字或提示语。</div>
      </div>
      <h3 class="sec">示例</h3>
      ${exList.map((e) => `
        <div class="ex-card">
          <div class="row"><span class="k">输入</span><code>${esc(e.input)}</code></div>
          <div class="row"><span class="k">输出</span><code>${esc(e.output)}</code></div>
          ${e.explain ? `<div class="row"><span class="k">说明</span><span class="muted">${esc(e.explain)}</span></div>` : ""}
        </div>`).join("") || '<span class="muted">无</span>'}`;
    $("st-qid").textContent = q.id;
    $("st-phase").textContent = "阶段 " + (PHASE_LABEL[q.phase] || q.phase || "未标注");
    refreshBanner(); refreshButtons();
    notify("idle", phaseAllowsTeaching() ? "可提交，也可请求提示" : "当前阶段不提供 AI 提示", "op-msg");
    // 选定题目后自动收起目录：读题时把整栏高度留给题干；「切换题目」可随时展开
    applyListCollapsed(true);
  }

  // ---------- 左栏：程序运行结果（**结构化渲染，不复述多次 fail**）----------
  const ERROR_TYPE_LABEL = {
    none: "无错误", syntax: "语法错误", runtime: "运行时错误",
    timeout: "运行超时", wrong_output: "输出不正确"
  };
  function renderJudge(d) {
    if (d.status === "judge_unavailable") {
      // 安全门拒判：**不是**判题失败，也不是 runtime error —— 单独一种结论
      $("h-judge").textContent = "判题环境未就绪";
      $("tab-judge").innerHTML =
        '<div class="flag">⚠ 本次提交<b>没有执行判题</b>，也没有在你的电脑上启动任何学生代码。</div>'
        + `<div class="muted">${esc(d.message || state.isolationNote || "")}</div>`;
      return;
    }
    const failed = d.failed_cases || [];
    const pass = d.status === "pass";
    // 标题栏只给一个结论；正文里不再重复出现 `fail`／"判题状态：fail"
    $("h-judge").textContent = pass ? "已通过" : `未通过 · ${failed.length} 个用例未通过`;
    const parts = [];
    if (pass) {
      parts.push('<div>全部可见与隐藏用例均通过。</div>');
    } else {
      if (d.error_type) {
        parts.push(`<div><b>错误类型</b>：${esc(ERROR_TYPE_LABEL[d.error_type] || d.error_type)}</div>`);
      }
      if (d.stderr) {
        parts.push('<div style="margin-top:8px"><b>错误输出</b></div>'
          + `<div class="muted">${esc(d.stderr)}</div>`);
      }
    }
    failed.forEach((c) => {
      // 隐藏用例：**输入、期望、实际输出一个都不渲染**（服务端已清空，这里再兜一道，
      // 避免将来服务端口径变化时前端又把数据放出来）
      parts.push(`<div class="case ${c.hidden ? "hidden" : ""}">`
        + `<div>· 用例 #${esc(c.case_index)}${c.hidden ? "（隐藏用例，不回显输入/期望/实际输出）" : ""}</div>`
        + (c.hidden ? "" : `<div class="muted">输入：${esc(c.input)}</div>`)
        + (c.hidden ? "" : `<div class="muted">期望：${esc(c.expected)}</div>`)
        + (c.hidden ? "" : `<div class="muted">实际：${esc(c.actual)}</div>`)
        + `</div>`);
    });
    if (state.debug && d.judge_feedback) {
      parts.push('<div class="flag" style="margin-top:14px">调试：judge_feedback<br>'
        + `${esc(d.judge_feedback)}</div>`);
    }
    $("tab-judge").innerHTML = parts.join("");
  }

  // ---------- 右栏：AI 学习提示（**本次提示在最前**）----------
  function renderHint(d) {
    if (d.status === "judge_unavailable") {
      // 同一道安全门：提示请求也被拒绝，**没调模型、没起进程**
      $("h-hint").textContent = "判题环境未就绪";
      $("tab-hint").innerHTML =
        '<div class="flag">⚠ 本次请求<b>没有生成学习提示</b>：判题环境未就绪，'
        + '服务端未执行任何学生代码。</div>'
        + `<div class="muted">${esc(d.message || state.isolationNote || "")}</div>`;
      return;
    }
    // 头部一行：**只有已请求时才报"本次提示 L?"**。
    // 未请求时的 0 表示"本次没有提示"，不是教学等级 L0 —— 不能显示成 L0。
    const disabled = d.source === "phase_disabled";
    const requested = !!d.hint_requested;
    if (requested) {
      state.hintRequested = true;
      if (d.hint_request_id) { state.lastHintRequestId = d.hint_request_id; saveHintRid(d.hint_request_id); }
    }
    $("btn-hint").textContent = hintButtonLabel();
    refreshButtons();
    $("h-hint").textContent = disabled ? "本阶段不提供提示"
      : (requested ? `本次提示 L${d.hint_level}｜已解锁至 L${d.unlocked_level}`
                   : `已解锁至 L${d.unlocked_level}`);
    const parts = [];
    if (disabled) {
      parts.push('<div class="flag">当前阶段不提供 AI 学习提示（你的提交仍会正常记录）。</div>');
    } else if (d.source === "raw_llm") {
      parts.push('<div class="flag">⚠ 兜底回复：本次未走教学组件（source = raw_llm）</div>');
    }
    if (state.judgeStub && d.source !== "phase_disabled") {
      parts.push(`<div class="flag">${esc(STUB_HINT_NOTE)}</div>`);
    }
    // ① 本次提示（放最前，**不再重复 L?**，等级只在头部那行显示）
    // 未请求 / 通过态各有自己的小标题，避免把"没有提示"说成"本次学习提示"
    const head = disabled ? "阶段说明"
      : requested ? "本次学习提示"
      : (d.status === "pass" ? "本次反馈" : "尚未请求学习提示");
    parts.push(`<div class="hint-text"><b>${esc(head)}</b></div>`);
    parts.push(`<div class="hint-text">${esc(d.message)}</div>`);
    // ② 相关知识点
    if (d.knowledge_point) parts.push(`<div class="kp">相关知识点：${esc(d.knowledge_point)}</div>`);
    // ③ 历史易错提醒（弱化 + 可折叠；演示数据要标明）
    if (d.memory_hint) {
      parts.push(`<details class="memo"><summary>历史易错提醒</summary>`
        + `<div style="margin-top:6px">${esc(d.memory_hint)}</div>`
        + (state.judgeStub ? '<div style="margin-top:4px">（本机演示累计，不是真实学生的学习记录）</div>' : "")
        + `</details>`);
    }
    if (state.debug) {
      const c = d.components || { executed: [], skipped: [] };
      parts.push('<div class="flag" style="margin-top:14px">调试：组件轨迹<br>'
        + `已执行：${esc((c.executed || []).join(" → ") || "（无）")}<br>`
        + `被跳过：${esc((c.skipped || []).join(", ") || "（无）")}</div>`);
    }
    $("tab-hint").innerHTML = parts.join("");
  }

  function renderStatus(d) {
    $("st-pid").textContent = $("pid").value || "（未填编号）";
    renderLevels(d.hint_level, d.unlocked_level);
    const log = d.log;
    $("st-seq").textContent = log ? `提交序号 ${log.submit_seq}` : "提交序号 —（本次未提交）";
    $("st-ms").textContent = log ? `耗时 ${log.elapsed_ms} ms` : "耗时 —";
  }
  function renderAll(d) { renderJudge(d); renderHint(d); renderStatus(d); }

  // ---------- 请求 ----------
  function baseBody() {
    // 有访问码时，身份由服务端从凭证解析；页面不提交自填编号（避免"该填谁"的困扰和冒名）。
    const hasCode = !!($("access").value || "").replace(/\s+/g, "");
    const pid = hasCode ? "" : ($("pid").value || "").trim();
    if (!hasCode && !pid) { notify("bad", "请先填写被试编号", "op-msg"); throw new Error("no participant_id"); }
    if (!state.qid) { notify("bad", "请先选择题目", "op-msg"); throw new Error("no question_id"); }
    return { participant_id: pid, question_id: state.qid, code: getCode() };
  }

  async function submit() {
    if (state.busy) return;                       // 防重复点击
    setBusy(true, "judge");
    try {
      const body = baseBody(); body.group = GROUP; body.request_hint = false;
      const r = await fetch("/api/submit", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, accessHeaders()),
        body: JSON.stringify(body)
      });
      if (r.status === 429) {
        const d = await r.json().catch(() => ({}));
        notify("busy", (d.detail && d.detail.message) || "服务正忙：另一请求正在执行，请稍后再试；代码没有丢失。", "op-msg");
        return;
      }
      if (r.status === 403) {
        const d = await r.json().catch(() => ({}));
        setIdentity("bad", "身份：未通过");
        notify("bad", accessErrorText(d), "op-msg");
        return;
      }
      const d = await r.json();
      setIdentity("ok", "身份：已验证");
      renderAll(d);
      if (d.status === "judge_unavailable") {
        notify("bad", "提交未执行：判题环境未就绪", "op-msg");
      } else {
        notify(d.status === "pass" ? "ok" : "bad",
          d.status === "pass" ? "提交完成：全部用例通过" : "提交完成：未通过", "op-msg");
      }
    } catch (e) {
      if (e.message !== "no participant_id" && e.message !== "no question_id") {
        $("tab-judge").textContent = "请求失败：" + e;
        $("h-judge").textContent = "请求失败";
        notify("bad", "提交失败：网络或服务异常", "op-msg");
      }
    } finally { setBusy(false, "judge"); }
  }

  async function requestHint(repeat) {
    if (state.busy) return;
    if (!phaseAllowsTeaching()) { notify("bad", "当前阶段不提供 AI 学习提示", "op-msg"); return; }
    // 重看：复用上一次的请求号 ⇒ 服务端回放缓存，不升级、不调模型。
    const reqId = repeat ? state.lastHintRequestId : newRequestId();
    if (!reqId) { notify("bad", "还没有可重看的提示", "op-msg"); return; }
    setBusy(true, "hint");
    try {
      const body = baseBody();   // 走独立接口：不写 submission_log，不虚增"提交次数"
      body.hint_request_id = reqId;
      const r = await fetch("/api/hint", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, accessHeaders()),
        body: JSON.stringify(body)
      });
      if (r.status === 429) {
        // 单路执行闸门：服务端正忙。**不自动重试**，代码留在编辑器里；
        // 必须回到可操作状态（按钮恢复），否则用户会被永久卡在"生成中"。
        const d = await r.json().catch(() => ({}));
        notify("busy", (d.detail && d.detail.message) || "服务正忙：另一请求正在执行，请稍后再试；代码没有丢失。", "op-msg");
        return;
      }
      const d = await r.json();
      if (r.status === 403) {
        setIdentity("bad", "身份：未通过");
        notify("bad", accessErrorText(d), "op-msg");
        return;
      }
      if (!repeat) { state.hintRequested = true; state.lastHintRequestId = reqId; saveHintRid(reqId); }
      setIdentity("ok", "身份：已验证");
      renderAll(d);
      notify(repeat ? "ok" : "ok", repeat ? "已重新显示上次提示（未升级）" : "提示已返回", "op-msg");
    } catch (e) {
      if (e.message !== "no participant_id" && e.message !== "no question_id") {
        $("tab-hint").textContent = "请求失败：" + e;
        $("h-hint").textContent = "请求失败";
        notify("bad", "提示请求失败：网络或服务异常", "op-msg");
      }
    } finally { setBusy(false, "hint"); }
  }
  function newRequestId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "r-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }
  function accessHeaders() {
    const code = ($("access").value || "").replace(/\s+/g, "");
    return code ? { "X-Access-Code": code } : {};
  }

  // ---------- 阶段流程（前测 → 练习 → 后测，服务端锁定）----------
  function renderPhase(d) {
    const ph = (d && d.phase) || "";
    state.phase = ph;
    const el = $("phase-state");
    if (el) {
      el.textContent = "阶段：" + (ph ? (PHASE_LABEL[ph] || ph) : "—");
      el.className = "notice " + (ph === "done" ? "ok" : "idle");
    }
    const fin = $("btn-finish");
    if (fin) fin.style.display = ph && ph !== "done" ? "" : "none";
    if (ph === "done") {
      $("btn-submit").disabled = true;
      $("btn-hint").disabled = true;
      $("btn-rehint").disabled = true;
      notify("ok", "三个阶段都已完成，感谢参与！", "op-msg");
    }
  }
  async function refreshPhase() {
    try {
      const r = await fetch("/api/me", { headers: accessHeaders() });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.phase) renderPhase(d);
    } catch (e) { /* 忽略：阶段显示失败不影响做题 */ }
  }
  async function finishPhase() {
    if (!confirm("结束本阶段？结束后进入下一阶段；本阶段未通过、未完成的题目会如实保留，不能返回修改。")) return;
    try {
      const r = await fetch("/api/phase/advance", { method: "POST" });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        notify("bad", (d.detail && d.detail.message) || "无法结束阶段，请刷新后重试", "op-msg");
        return;
      }
      renderPhase(d);
      state.question = null;
      state.hintRequested = false;
      state.lastHintRequestId = null;
      $("qdetail").innerHTML = "";
      await loadQuestionList();
      notify("ok", "已进入" + (d.label || "下一阶段"), "op-msg");
    } catch (e) {
      notify("bad", "网络错误，请重试", "op-msg");
    }
  }

  // 访问码模式：编号不由学生填写，服务端按码解析后回填为只读
  let _idTimer = null;
  async function syncIdentity() {
    const code = ($("access").value || "").replace(/\s+/g, "");
    if (!code) { $("pid").readOnly = false; return; }
    try {
      const r = await fetch("/api/me", { headers: accessHeaders() });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.participant_id) {
        $("pid").value = d.participant_id;
        $("pid").readOnly = true;
        $("st-pid").textContent = d.participant_id + "（由访问码确定）";
        setIdentity("ok", "身份：已验证 " + d.participant_id);
      } else {
        $("pid").readOnly = false;
        setIdentity("bad", "身份：未通过");
      }
    } catch (e) { /* 忽略 */ }
  }

  // 自动登记模式：新电脑第一次打开时由服务端分配编号（Cookie 记住），编号框改为只读。
  async function ensureEnrollment() {
    try {
      const resp = await fetch("/api/enroll", { method: "POST" });
      if (!resp.ok) return;                    // 未开启 / 用访问码的批次：保持手动填写
      const d = await resp.json();
      if (!d.participant_id) return;
      $("pid").value = d.participant_id;
      $("pid").readOnly = true;
      $("pid").title = "本机编号由服务端自动分配，不需要手改";
      $("st-pid").textContent = d.participant_id + "（本机自动分配）";
      setIdentity("ok", "身份：已登记 " + d.participant_id);
      try { sessionStorage.setItem("ph_pid", d.participant_id); } catch (e) { /* 忽略 */ }
    } catch (e) { /* 忽略：退回手动模式 */ }
  }
  function accessErrorText(d) {
    const s = (d && d.detail && d.detail.status) || "";
    if (s === "access_denied") {
      const n = ($("access").value || "").replace(/\s+/g, "").length;
      return "访问码无效或已过期（当前输入 " + n + " 字符，完整一串应为 189 字符，请重新整串粘贴）";
    }
    if (s === "phase_not_allowed") return "该题不属于当前实验阶段，已拒绝（不会判题）。";
    if (s === "identity_mismatch") return "被试编号与访问码不一致，请核对。";
    return "请求被拒绝：" + s;
  }

  // ---------- 绑定 ----------
  $("btn-submit").onclick = submit;
  $("btn-hint").onclick = () => requestHint(false);
  $("btn-rehint").onclick = () => requestHint(true);
  $("btn-finish").onclick = finishPhase;
  $("btn-debug").onclick = () => { state.debug = !state.debug; applyDebug(); };
  $("pid").oninput = () => { $("st-pid").textContent = $("pid").value || "（未填编号）"; };

  applyDebug();
  initEditor();
  initSplitter();
  initSideDrag();
  loadStatus();
  loadComponents();
  ensureEnrollment();
  syncIdentity();
  refreshPhase();
  loadQuestionList();
</script>
</body>
</html>
