<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教学法 Harness 练习助手</title>
  <!-- CodeMirror（CDN） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css" />
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.js"></script>
  <style>
    body { font-family: -apple-system, "Microsoft YaHei", sans-serif; margin: 24px; color: #222; }
    .row { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .CodeMirror { height: 260px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { padding: 6px 14px; border-radius: 6px; border: 1px solid #bbb; background: #f6f6f6; cursor: pointer; }
    button.primary { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
    pre#out { background: #f7f7f7; border: 1px solid #ddd; border-radius: 6px; padding: 12px; white-space: pre-wrap; }
    label { font-size: 14px; }
    input, select { padding: 4px 8px; }
  </style>
</head>
<body>
  <h1>教学法 Harness 练习助手</h1>
  <p style="font-size:13px;color:#666">Phase 1 骨架：判题与三组件当前为桩实现，用于跑通纵切链路。</p>

  <div class="row">
    <label>被试编号 <input id="pid" value="S01" size="6" /></label>
    <label>题目
      <select id="qid"><option value="P001">P001</option></select>
    </label>
    <label>分组
      <select id="group">
        <option value="exp">exp 实验组（组件全开）</option>
        <option value="ctrl">ctrl 对照组（裸大模型）</option>
        <option value="abl_hint">abl_hint 消融·只留提示阶梯</option>
        <option value="abl_cls">abl_cls 消融·只留分类器</option>
        <option value="abl_mem">abl_mem 消融·只留错误记忆</option>
      </select>
    </label>
  </div>

  <textarea id="editor"># 在此写你的代码
a, b = map(int, input().split())
print(a + b)
</textarea>

  <div class="row" style="margin-top:12px">
    <button class="primary" onclick="submit(false)">提交代码</button>
    <button onclick="submit(true)">提交并请求提示</button>
  </div>

  <h3>系统反馈</h3>
  <pre id="out">（等待提交）</pre>

  <script>
    const editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
      mode: "python", lineNumbers: true, indentUnit: 4
    });

    async function submit(requestHint) {
      const body = {
        participant_id: document.getElementById("pid").value,
        question_id: document.getElementById("qid").value,
        code: editor.getValue(),
        group: document.getElementById("group").value,
        request_hint: requestHint
      };
      const out = document.getElementById("out");
      out.textContent = "提交中…";
      try {
        const res = await fetch("/api/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        out.textContent = JSON.stringify(await res.json(), null, 2);
      } catch (e) {
        out.textContent = "请求失败：" + e;
      }
    }
  </script>
</body>
</html>
